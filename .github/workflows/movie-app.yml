name: ScreenShelf React app

on:
  push:
    branches:
      - react-media-catalog
    paths:
      - 'movie-app/**'
      - 'vercel.json'
      - '.github/workflows/movie-app.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'movie-app/**'
      - 'vercel.json'
      - '.github/workflows/movie-app.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movie-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm test
