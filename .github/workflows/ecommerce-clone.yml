name: NOVA Market React app

on:
  push:
    branches:
      - ecommerce-storefront
    paths:
      - 'ecommerce-clone/**'
      - '.github/workflows/ecommerce-clone.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ecommerce-clone/**'
      - '.github/workflows/ecommerce-clone.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-clone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ecommerce-clone/package.json
      - run: npm install
      - run: npm run build